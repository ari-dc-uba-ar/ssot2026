name: ssot2026

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssot2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssot2026_local}
      POSTGRES_DB: ${PGDATABASE:-ssot2026}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  backend:
    image: ssot2026-backend:local
    build: &backend-build
      context: .
      additional_contexts:
        system-definition: ../system-definition
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      <<: &app-database
        PGHOST: postgres
        PGPORT: "5432"
        PGDATABASE: ${PGDATABASE:-ssot2026}
        PGUSER: ${PGUSER:-ssot2026_user}
        PGPASSWORD: ${PGPASSWORD:-ssot2026_app_local}
      PORT: "3001"
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-jamaica123}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-josecito1234}
      JWT_SECRET: ${JWT_SECRET:-265018ff912d3101ecf1812623d191a57baa9247b1e9b54cdbb9324d27bd8797}
    ports:
      - "127.0.0.1:3001:3001"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrations:
    image: ssot2026-backend:local
    build: *backend-build
    command: ["npm", "run", "migration:apply", "--", "--non-interactive"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-database
      POSTGRES_USER: ${POSTGRES_USER:-ssot2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssot2026_local}
      MIGRATION_PGUSER: ${MIGRATION_PGUSER:-ssot2026_owner}
      MIGRATION_PGPASSWORD: ${MIGRATION_PGPASSWORD:-ssot2026_owner_local}
    volumes:
      - ./migrations:/workspace/ssot2026/migrations
    restart: "no"
    init: true

volumes:
  postgres_data:
