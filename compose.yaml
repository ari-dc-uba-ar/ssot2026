name: ssot2026

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssot2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssot2026_local}
      POSTGRES_DB: ${PGDATABASE:-ssot2026}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  backend:
    image: ssot2026-backend:local
    build:
      context: .
      additional_contexts:
        system-definition: ../system-definition
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-ssot2026}
      PGUSER: ${PGUSER:-ssot2026_user}
      PGPASSWORD: ${PGPASSWORD:-ssot2026_app_local}
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
